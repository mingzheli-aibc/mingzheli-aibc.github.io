# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: /
    weight: 10
  - name: Hiring
    url: /#hiring
    weight: 20
  - name: News
    url: /#news
    weight: 30
  - name: Publications
    url: /#papers
    weight: 40
  - name: Projects
    url: projects/
    weight: 50
  - name: Teaching
    url: courses/
    weight: 60
  - name: Other Info
    url: experience/
    weight: 70

